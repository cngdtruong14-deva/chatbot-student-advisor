name: Foundation CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ml-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies and advisor_core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ml/requirements-test.lock
          python -m pip install packages/advisor_core
      - name: Verify ML isolation and schema binding
        run: python ml/test_ml_isolation.py
  worktree-safety:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify worktree safety sandbox
        shell: pwsh
        run: ./ops/Test-Worktrees.ps1
      - name: Verify bootstrap safety sandbox
        shell: pwsh
        run: ./ops/Test-InitializeLocal.ps1

  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral local configuration
        shell: pwsh
        run: |
          ./ops/Initialize-Local.ps1
          ./ops/Initialize-Application.ps1
      - name: Validate and start
        run: |
          docker compose config --quiet
          docker compose build api web
          docker compose up -d --wait --wait-timeout 180
      - name: Unit and integration tests
        shell: pwsh
        run: ./ops/Test-Foundation.ps1
      - name: Service status
        if: always()
        run: docker compose ps -a
      - name: Application security and academic integration (ephemeral CI database only)
        run: docker compose exec -T -e APP_ENV=test -e ADVISOR_TEST_DATABASE=1 -e RAG_LLM_ENABLED=0 api python -m tests.integration_application
      - name: Full database flow regression (ephemeral CI database only)
        run: docker compose exec -T -e APP_ENV=test -e ADVISOR_TEST_DATABASE=1 -e ADVISOR_DOCUMENT_DB_TEST=1 -e RAG_METHOD=keyword -e RAG_LLM_ENABLED=0 api python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generated frontend API types drift
        run: node frontend/scripts/generate-api-types.mjs --check
      - name: Frontend to reviewed OpenAPI route contract
        run: node frontend/tests/api-contracts.cjs backend/tests/openapi.snapshot.json
      - name: Final service status
        if: always()
        run: docker compose ps -a
      - name: Stop ephemeral CI stack
        if: always()
        run: docker compose down
