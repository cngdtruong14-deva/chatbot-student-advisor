services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: student_advisor
      POSTGRES_USER: advisor_admin
      POSTGRES_PASSWORD: ${PHASE_B_ADMIN_PASSWORD:?required}
      MIGRATOR_DB_PASSWORD: ${PHASE_B_MIGRATOR_PASSWORD:?required}
      APP_DB_PASSWORD: ${PHASE_B_APP_PASSWORD:?required}
    volumes:
      - phase_b_postgres:/var/lib/postgresql/data
      - ./postgres/010-roles.sh:/docker-entrypoint-initdb.d/010-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U advisor_admin -d student_advisor]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [phase_b_database]

  migrate:
    image: ${PHASE_B_API_IMAGE:?required}
    command: [alembic, upgrade, head]
    environment:
      DB_HOST: db
      DB_NAME: student_advisor
      DB_USER: advisor_migrator
      DB_PASSWORD: ${PHASE_B_MIGRATOR_PASSWORD:?required}
    depends_on:
      db:
        condition: service_healthy
    networks: [phase_b_database]
    security_opt: [no-new-privileges:true]

  api:
    image: ${PHASE_B_API_IMAGE:?required}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: db
      DB_NAME: student_advisor
      DB_USER: advisor_app
      DB_PASSWORD: ${PHASE_B_APP_PASSWORD:?required}
      JWT_SECRET: ${PHASE_B_JWT_SECRET:?required}
      ADVISOR_TEST_DATABASE: '1'
      APP_ENV: test
      ADVISOR_DOCUMENT_DB_TEST: '1'
      RAG_METHOD: keyword
      RAG_LLM_ENABLED: '0'
      MODEL_DIRECTORY: /tmp/models
      RAG_DIRECTORY: /tmp/vectorstore
      HF_HOME: /tmp/hf
      HF_HUB_OFFLINE: '1'
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [phase_b_database]

volumes:
  phase_b_postgres:

networks:
  phase_b_database:
    internal: true
