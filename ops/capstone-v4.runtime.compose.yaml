# Runtime-only overlay for the owner-accepted Stage 7 V4 Capstone release.
# It contains no credentials. Secrets continue to come from the normal .env.
services:
  migrate:
    image: sic-student-advisor-api:capstone-v4-scope-fix
  api:
    image: sic-student-advisor-api:capstone-v4-scope-fix
    environment:
      RAG_METHOD: keyword
      RAG_LLM_PROMPT_VERSION: decision_tree_stage7/1
      RAG_RUNTIME_APPROVAL_PATH: /artifacts/stage7/benchmark_v4/rag_runtime_approval_capstone_v4.signed.json
      RAG_RELEASE_RECEIPT_PATH: /artifacts/stage7/effectivity/release_receipt.current.json
  web:
    image: sic-student-advisor-web:capstone-v4-waiver
